name: Build and Release

permissions:
  contents: write
  actions: read
  checks: write
  deployments: write
  issues: write
  packages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

on:
  push:
    branches:
      - 'feat/add-login-page'
      - 'feat/add-login-page-fix'
      - 'feat/add-login-page-workflow-fix'
      - 'feat/linux-build'
      - 'linux-build'
      - 'fix/linux-build-dependencies'
      - 'feat/web-build'
  workflow_dispatch:  # 允许手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Setup signing
      run: |
        # 创建签名密钥文件
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/wordflow-key.jks
        
        # 创建key.properties文件
        echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=../wordflow-key.jks" >> android/key.properties
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev gstreamer1.0-plugins-base
        
    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Create Linux support files
      run: flutter create . --platforms=linux

    - name: Build Linux
      run: flutter build linux --release

    - name: Upload Linux build as artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: build/linux/x64/release/bundle/

  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Disable Linux Support
      run: |
        flutter config --no-enable-linux-desktop
        flutter config --enable-web
        
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang cmake ninja-build pkg-config \
          libgtk-3-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-good1.0-dev
          
    - name: Get dependencies
      run: flutter pub get

    - name: Build web
      run: flutter build web --release

    - name: Upload web build as artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-release
        path: build/web/
